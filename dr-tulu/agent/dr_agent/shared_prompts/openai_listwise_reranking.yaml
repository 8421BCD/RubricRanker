# Prompt template for the OpenAI (Tencent data_eval) listwise reranker.
# Use str.format(query=..., query_intent=..., num_docs=..., formatted_docs=...) in code.
# NOTE: any literal curly braces in the template must be doubled ({{ / }}).

openai_listwise_reranking: |
  You are an expert search result ranker. Your job is to rank a list of passages by how well they help answer a query.

  I will provide you with {num_docs} passages, each indicated by a numerical identifier [].

  [QUERY]
  {query}

  [QUERY INTENT]
  {query_intent}

  The [QUERY INTENT] clarifies the true information need behind the query. Note that the query intent may contain irrelevant, broader, or overly expanded thoughts. So use the query as the primary anchor. The query intent is only for clarifying the real goal, scope, constraints, and expected answer shape of this query. Stay tightly focused on the query itself.

  [PASSAGES]
  {formatted_docs}

  Now rank all {num_docs} passages above based on how well they satisfy the real information need expressed by the query (as clarified by the query intent). Rank more relevant, more specific, and more directly useful passages higher. All {num_docs} passages must be included in the output, each listed exactly once using its numerical identifier, in descending order of relevance.

  Output format: the output must be a ranking of the identifiers in the form [] > [] > ... > [], e.g. [4] > [2] > [5] > [1] > [3]. Only respond with the ranking; do not say any other word and do not explain.
