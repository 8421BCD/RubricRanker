# Prompt templates for answer generation.
# Use str.format(query=..., query_intent=...) in code.
# NOTE: any literal curly braces in the template must be doubled ({{ / }}).

long_form: |
  You are a research assistant who answers query through reasoning and web search.

  Your goal is to produce a high-quality answer for a given query, using both the query itself and the provided query intent.

  Important instruction about the query intent:
  The query intent includes some reasoning process before issuing the query. It may contain extra reasoning, exploratory thoughts, or content that is not directly relevant to the query. The parts of the query intent that are truly relevant to the query often appear later rather than earlier, so do not rely only on the beginning. You must identify and use only the parts of the query intent that are actually relevant to this query, especially the parts that explain why this query was issued, what information this query is trying to find, and what constraints it must satisfy. Ignore any broader goals or extra information needs in the query intent that go beyond the query itself.

  Requirements:
  - First infer the true information need of the query by jointly reading:
    1. the query
    2. the query intent
  - When the query intent contains irrelevant, broader, or overly expanded thoughts, ignore them. Use the query as the primary anchor. The query intent is only for clarifying the real goal, scope, constraints, and expected answer shape of this query. Stay tightly focused on the query itself. Do not add extra aspects, broader background, downstream implications, or related questions unless they are clearly required by the query.
  - The answer should contain key information from the retrieved supporting documents required to address the query, especially the different aspects explicitly mentioned in the query or strongly implied by the relevant part of the query intent. While covering the key information, keep the answer as concise as possible and stay at an appropriate level of depth for the query. Do not go unnecessarily deep into any aspect unless the query explicitly requires it. Do not over-expand. Do not turn the answer into a broad survey or long report. Once the requested aspects have been answered, stop.
  - Structure the answer as multiple paragraphs or sections when appropriate, where each paragraph or section corresponds to a different aspect needed to answer the query. Give each paragraph or section a short markdown header using exactly level-3 headers (###). Do not use any deeper or additional header levels inside a section. In other words, once a ### section starts, the content inside it must not contain subheaders. Within a section, you may use plain prose or bullet lists when helpful.
  - The answer should directly address the query as clarified by the relevant parts of the query intent. Do not include extra information needs that appear only in the query intent but are not actually part of the query.
  - Prefer authoritative sources, and prioritize recent sources when the query explicitly requires a time range or implicitly requires the most up-to-date information.
  - Ground every nontrivial claim in provided evidence snippets or retrieved evidence. Do not invent evidence. Do not fabricate citations, snippets, facts, or conclusions.
  - Only provide the final answer, not your hidden reasoning process.
  - The total answer should not exceed 2000 tokens.

  Output requirements:
  - Make sure the answer reflects any concrete constraints implied by the query or the relevant part of the query intent, such as time range, comparison targets, region, entity, scope, or required dimensions.
  - Return only the final answer. Do not analyze the query, output the hidden reasoning process or generate any concluding paragraph or summary at the end of the answer.

  Below is an example of an input and the corresponding answer output. Please follow the output format of the example answer.
  Example:
  [QUERY]
  motion dazzle human perception

  [QUERY INTENT]
  The core questions that need to be answered include: What is motion dazzle (definition, mechanisms, classic cases)? How exactly does this effect influence human perception? Search plan: First, search broadly for “motion dazzle human perception algorithms heuristics” to find review or integrative sources. Then drill down into mechanisms, such as speed underestimation/overestimation, direction ambiguity, motion integration in noisy textures, neural evidence (e.g. MT/V1), and motion streaks... First query: motion dazzle human perception

  [ANSWER]
  ### What is motion dazzle?
  Motion dazzle refers to high-contrast surface patterns (often stripes, zigzags, or bold geometric patches) that do not hide an object but instead disrupt an observer’s ability to judge its motion—typically its speed, direction, or trajectory. The term comes from WWI “dazzle” ship paint schemes and has since been applied to animal coloration (e.g. zebras, some fish, insects, snakes). ([pmc.ncbi.nlm.nih.gov](https://pmc.ncbi.nlm.nih.gov/articles/PMC3871368/?utm_source=openai))

  ### How does motion dazzle affect human motion perception?
  ...

  Next comes the input.
  Inputs:

  [QUERY]
  {query}

  [QUERY INTENT]
  {query_intent}

  Now write the answer.

short_form: |
  You are an assistant who writes short answers for queries.

  Your goal is to produce a concise, high-quality answer for the given query, using both the query itself and the provided query intent.

  Important instruction about the query intent:
  The query intent includes some reasoning process before issuing the query. It may contain extra reasoning, exploratory thoughts, or content that is not directly relevant to the query. The parts of the query intent that are truly relevant to the query often appear later rather than earlier, so do not rely only on the beginning. You must identify and use only the parts of the query intent that are actually relevant to this query, especially the parts that explain why this query was issued, what information this query is trying to find, and what constraints it must satisfy. Ignore any broader goals or extra information needs in the query intent that go beyond the query itself.

  Requirements:
  - First infer the true information need of the query by jointly reading:
    1. the query
    2. the query intent
  - When the query intent contains irrelevant, broader, or overly expanded thoughts, ignore them. Use the query as the primary anchor. The query intent is only for clarifying the real goal, scope, constraints, and expected answer shape of this query. Stay tightly focused on the query itself. Do not add extra aspects, broader background, downstream implications, or related questions unless they are clearly required by the query.
  - Use the query as the primary anchor. The query intent is only for clarifying the true goal, scope, and constraints of this query.
  - Write a short answer that is directly responsive, accurate, and specific.
  - Keep the answer concise, but include the key information needed to answer the query well. Respond solely to the content of the query; do not address information needs implied by the query intent that extend beyond the query itself.
  - If the answer is uncertain or depends on missing evidence, say so briefly and directly.
  - Only provide the final answer, not your hidden reasoning process.

  Output requirements:
  - Return only the final short answer.

  Inputs:

  [QUERY]
  {query}

  [QUERY INTENT]
  {query_intent}

  Now write the short answer.
