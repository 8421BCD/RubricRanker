# Prompt templates for doc-level rubric scoring (Source Authority / Timeliness).
# The model scores ONE candidate document against the provided rubric(s) and
# outputs integer score(s) in [0, 10], space-separated, in the order the
# rubrics are listed in the prompt. No other text.
#
# Two scenarios:
#   - deepresearch: sub-queries from a deep-research agent. The agent's
#     reasoning ("thinking") before issuing the query is provided as
#     query intent. Format with: query, query_intent, rubrics_block, doc_content.
#   - rag: plain user questions. No thinking.
#     Format with: query, rubrics_block, doc_content.
#
# NOTE: any literal curly braces in the template must be doubled ({{ / }}).

deepresearch: |-
  You are a strict document grader. Given a search query issued by a deep-research agent, the agent's reasoning as query intent, a single retrieved candidate document, and one or more scoring rubrics, give each rubric an INTEGER score from 0 (worst) to 10 (best) for this document.

  The query intent may clarify why this query was issued and what information it is trying to find, but it may also contain broader, exploratory, or irrelevant thoughts. Stay anchored on the query itself and only use the parts of the query intent that are actually relevant.

  Scoring rules:
  - Judge the document strictly against each rubric's description. Each rubric is independent.
  - Higher score = the document better matches the rubric description; lower score = worse match.

  Output format (STRICT): output ONLY the integer scores in the SAME ORDER as the rubrics listed below, separated by a single space. No other text, no explanation, no labels.
  Example (when 2 rubrics are listed): 7 3
  Example (when 1 rubric is listed): 5

  [QUERY]
  {query}

  [QUERY INTENT]
  {query_intent}

  [SCORING RUBRICS]
  {rubrics_block}

  [CANDIDATE DOCUMENT]
  {doc_content}

  Now output the scores.

rag: |-
  You are a strict document grader. Given a user question, a single retrieved candidate document, and one or more scoring rubrics, give each rubric an INTEGER score from 0 (worst) to 10 (best) for this document.

  Scoring rules:
  - Judge the document strictly against each rubric's description. Each rubric is independent.
  - Higher score = the document better matches the rubric description; lower score = worse match.
  - If the document is unreadable, off-topic, or provides no signal for a rubric, give 0 for that rubric.

  Output format (STRICT): output ONLY the integer scores in the SAME ORDER as the rubrics listed below, separated by a single space. No other text, no explanation, no labels.
  Example (when 2 rubrics are listed): 7 3
  Example (when 1 rubric is listed): 5

  [QUERY]
  {query}

  [SCORING RUBRICS]
  {rubrics_block}

  [CANDIDATE DOCUMENT]
  {doc_content}

  Now output the scores.
